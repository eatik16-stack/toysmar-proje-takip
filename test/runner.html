<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Toysmar — test koşucusu</title>
<style>
  body{margin:0; font:13px/1.45 ui-monospace,monospace; background:#0c1314; color:#e9f0f0; display:grid; grid-template-columns:1fr 1fr; height:100vh}
  #log{padding:14px; overflow:auto; white-space:pre-wrap}
  #log .bad{color:#e87c70}
  #log .sum{font-weight:700; font-size:15px; margin-top:12px}
  iframe{width:100%; height:100%; border:0; border-left:1px solid #26383a; background:#fff}
</style>
</head>
<body>
<div id="log">Toysmar test koşucusu — bir statik sunucudan açın (file:// çalışmaz).
Başlatmak için: runner.html?run=1
</div>
<iframe id="app" src="about:blank"></iframe>
<script type="module">
  import { frameDriver } from "./frame-driver.mjs";
  import { runSuite } from "./suite.mjs";

  const logEl = document.getElementById("log");
  const log = function (s) {
    const div = document.createElement("div");
    div.textContent = s; if (s.indexOf("✗") !== -1) div.className = "bad";
    logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
  };
  window.__RESULT__ = null;

  async function main() {
    try { sessionStorage.clear(); localStorage.clear(); } catch (e) {}
    const t = frameDriver(document.getElementById("app"), log);
    try {
      await runSuite(t);
    } catch (e) {
      t.ok("senaryo çökmeden bitti", false, (e && e.message) || String(e));
      console.error(e);
    }
    const r = t.results;
    const sum = document.createElement("div"); sum.className = "sum" + (r.fail ? " bad" : "");
    sum.textContent = r.pass + " geçti, " + r.fail + " kaldı";
    logEl.appendChild(sum);
    window.__RESULT__ = { pass: r.pass, fail: r.fail, fails: r.fails };
  }
  if (new URLSearchParams(location.search).get("run")) main();
  window.__RUN__ = main;
</script>
</body>
</html>
